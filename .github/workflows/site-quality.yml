name: Static website quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check links, markup, form structure, scripts and staging safeguards
        run: node scripts/check-site.mjs
      - name: Install browser testing dependencies
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local preview and test browser behavior
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kybr-preview.log 2>&1 &
          sleep 2
          node scripts/browser-smoke.mjs
      - name: Probe Netlify staging deployment (diagnostic, non-blocking)
        continue-on-error: true
        run: |
          status=$(curl --location --silent --show-error --max-time 20 --output /tmp/kybr-netlify.html --write-out '%{http_code}' https://newkybr.netlify.app/ || true)
          echo "Netlify staging HTTP status: $status"
          test "$status" = "200"
          grep -q 'home.bundle.css' /tmp/kybr-netlify.html
          echo "Netlify page contains the latest stylesheet marker."
      - name: Save mobile and desktop QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kybr-browser-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
